    <script type="text/javascript">
      $(document).ready(function () {
        // 表单验证函数
        function isformnull() {
          $("input[name='money']").on('input', function() {
            getformnull();
          });
        }
        
        function getformnull() {
          var money = $("input[name='money']").val();
          if (!money || money == '') {
            return 1;
          }
          if (parseFloat(money) < 10) {
            return 2;
          }
          return 0;
        }
        
        isformnull();
        
        // 充值按钮点击事件
        $(".login-btn").click(function () {
          var check = getformnull();
          if (check == 1) {
            layer.msg("Receiving Address");
            return;
          }
          if (check == 2) {
            layer.msg("Minimum recharge is 10 USDT");
            return;
          }
          if (check == 0) {
            // 显示支付密码弹框
            const $dialogWrap1 = $("#dialogWrap1");
            const $dialog1 = $("#js_dialog_1");
            $dialogWrap1.fadeIn(200);
            $dialog1.addClass("weui-half-screen-dialog_show");
            setTimeout(function () {
              $dialogWrap1.attr("aria-hidden", "false");
              $dialogWrap1.attr("aria-modal", "true");
              $dialogWrap1.attr("tabindex", "0");
              $dialogWrap1.trigger("focus");
              $("input[name='paypwd']").focus();
            }, 200);
          }
        });
        
        // Submit password info
        $(".safekey .btnsubmit").click(function () {
          var paypwd = $("input[name='paypwd']").val();
          if (!paypwd || paypwd == '') {
            layer.msg("Please enter your payment password");
            return;
          }
          
          $("#loadingToast").show();
          
          var money = $("input[name='money']").val();
          var type = $("select[name='type']").val();
          
          $.ajax({
            type: "post",
            url: "/index/recharge/index.html",
            dataType: "json",
            data: {
              money: money,
              type: type,
              paypwd: paypwd
            },
            success: function (res) {
              $("#loadingToast").hide();
              layer.msg(res.msg);
              if (res.code == 99) {
                // jump to page
                window.location.href = res.url;
              } else {
                // incorrect password
                $("input[name='paypwd']").val('');
              }
            },
            error: function() {
              $("#loadingToast").hide();
              layer.msg("网络错误，请稍后重试");
            }
          });
        });
        
        // Cancel payment
        $(".safekey .btncancel").click(function () {
          closeDialog();
        });
        
        // Close pop up function
        function closeDialog() {
          const $dialogWrap1 = $("#dialogWrap1");
          const $dialog1 = $("#js_dialog_1");
          $dialog1.removeClass("weui-half-screen-dialog_show");
          $dialogWrap1.fadeOut(200);
          $dialogWrap1.attr("aria-hidden", "true");
          $dialogWrap1.removeAttr("aria-modal");
          $dialogWrap1.removeAttr("tabindex");
          $("input[name='paypwd']").val('');
        }
        
        // Click to close
        $("#dialogWrap1").click(function(e) {
          if (e.target === this) {
            closeDialog();
          }
        });
        
        // Enter to submit
        $("input[name='paypwd']").keypress(function(e) {
          if (e.which == 13) {
            $(".safekey .btnsubmit").click();
          }
        });

        // initialize type icon var
        var type = $("select[name='type']").find("option:selected").val();
        $(".icon-type").attr("src", "/image/" + type + ".png");
        
        // type switching
        $("select[name='type']").change(function () {
          type = $("select[name='type']").val();
          $(".icon-type").attr("src", "/image/" + type + ".png");
        });
      });
    </script>
