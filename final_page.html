    <title></title>
    <script>
(function() {
  const supported = {
    'en': 'en-cn',
    'ja': 'jp-cn',
    'pt': 'pt-cn',
    'fa': 'bs-cn',
    'ar': 'alb-cn',
    'es': 'xby-cn',
    'de': 'dg-cn',
    'ru': 'els-cn',
    'tr': 'trq-cn',
    'vi': 'yn-cn',
    'fr': 'fa-cn',
    'zh-hant': 'fanti-cn',
    'zh-tw': 'fanti-cn',
    'zh-hk': 'fanti-cn',
    'zh-mo': 'fanti-cn',
    'zh': 'fanti-cn'
  };

  function getPreferredLangs() {
    const arr = [];
    if (Array.isArray(navigator.languages)) arr.push(...navigator.languages);
    if (navigator.language) arr.push(navigator.language);
    if (!arr.length) arr.push('en');
    const out = arr.map(l => String(l || '').trim().toLowerCase()).filter(Boolean);
    console.log('[auto-lang] navigator:', arr, 'normalized:', out);
    return out;
  }

  function normalizeCandidates(langs) {
    const out = [];
    langs.forEach(l => {
      out.push(l);
      if (l.startsWith('zh')) {
        if (/-hant|traditional|-tw|-hk|-mo/.test(l)) {
          out.push('zh-hant');
        } else {
          out.push('zh');
        }
      }
      const base = l.split('-')[0];
      if (base && base !== l) out.push(base);
    });
    const dedup = Array.from(new Set(out));
    console.log('[auto-lang] candidates:', dedup);
    return dedup;
  }

  function pickMatch(candidates) {
    for (const c of candidates) {
      if (supported[c]) {
        console.log('[auto-lang] matched exact:', c, '->', supported[c]);
        return supported[c];
      }
    }
    for (const c of candidates) {
      const base = c.split('-')[0];
      if (supported[base]) {
        console.log('[auto-lang] matched base:', base, '->', supported[base]);
        return supported[base];
      }
    }
    console.warn('[auto-lang] no match');
    return '';
  }

  function redirectToSet(langCode) {
    // 如果此路径不工作，请改成你真实可访问的路由
    var url = '/index/lang/set.html?lang=' + encodeURIComponent(langCode);
    console.log('[auto-lang] redirect to:', url);
    window.location.replace(url);
  }

  function run() {
    console.log('[auto-lang] start');
    const candidates = normalizeCandidates(getPreferredLangs());
    const match = pickMatch(candidates);
   if (!match) {
console.warn('[auto-lang] fallback to EN');
redirectToSet('en-cn');
return;
}

    // 暂时注释掉避免拦截
     const cur = document.documentElement.getAttribute('data-lang') ||
                 localStorage.getItem('site_lang_code') || '';
     if (cur && cur === match) {
       console.log('[auto-lang] already set:', cur);
       return;
     }

    // 记录当前选择
    try { localStorage.setItem('site_lang_code', match); } catch(e) {}

    redirectToSet(match);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run, { once: true });
  } else {
    run();
  }
})();
</script>
